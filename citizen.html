<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCity AI | Citizen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50">
    <div class="max-w-md mx-auto min-h-screen relative pb-20 shadow-2xl bg-white">
        <div class="bg-emerald-500 text-white p-6 rounded-b-3xl shadow-lg">
            <h1 class="text-2xl font-bold">Help make your city cleaner.</h1>
            <div class="bg-white/20 backdrop-blur-md rounded-2xl p-4 mt-4 flex justify-between items-center">
                <div><p class="text-xs text-emerald-100 uppercase">CleanCity Points</p><p class="text-2xl font-bold flex items-center gap-2"><i data-lucide="star" class="w-5 h-5 text-yellow-300"></i> 320</p></div>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4 p-6">
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div class="text-blue-500 bg-blue-100 w-8 h-8 rounded-full flex items-center justify-center mb-2"><i data-lucide="file-text" class="w-4 h-4"></i></div>
                <p class="text-2xl font-bold">4</p><p class="text-xs text-slate-500">Reports Submitted</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div class="text-emerald-500 bg-emerald-100 w-8 h-8 rounded-full flex items-center justify-center mb-2"><i data-lucide="check-circle" class="w-4 h-4"></i></div>
                <p class="text-2xl font-bold">3</p><p class="text-xs text-slate-500">Issues Resolved</p>
            </div>
        </div>
        <div class="absolute bottom-6 w-full px-6 flex justify-center z-10">
            <a href="report.html" class="bg-slate-900 text-white w-full py-4 rounded-full font-bold shadow-xl flex justify-center items-center gap-2"><i data-lucide="camera"></i> Report Waste</a>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
