<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCity AI | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-300">
    <div class="min-h-screen flex">
        <aside class="w-64 glass-dark border-r border-slate-800 hidden md:flex flex-col">
            <div class="p-6 flex items-center gap-3 border-b border-slate-800"><div class="bg-emerald-500 p-2 rounded text-white"><i data-lucide="leaf"></i></div><span class="text-white font-bold text-xl">CleanCity AI</span></div>
            <div class="p-4 border-t border-slate-800 mt-auto"><a href="index.html" class="flex items-center gap-3 text-slate-500"><i data-lucide="log-out"></i> Exit Demo</a></div>
        </aside>
        <main class="flex-1 p-8 h-screen overflow-y-auto">
            <header class="mb-8"><h1 class="text-3xl font-bold text-white mb-1">Municipal Command Center</h1><p class="text-slate-500 text-sm">AI-Powered Urban Waste Intelligence</p></header>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="glass-dark p-6 rounded-2xl border border-slate-800"><p class="text-slate-400 text-sm">Total Reports</p><h3 id="totalReports" class="text-4xl font-bold text-white">-</h3></div>
                <div class="glass-dark p-6 rounded-2xl border border-slate-800"><p class="text-slate-400 text-sm">High Priority (AI)</p><h3 id="highPriority" class="text-4xl font-bold text-red-400">-</h3></div>
                <div class="glass-dark p-6 rounded-2xl border border-slate-800"><p class="text-slate-400 text-sm">AI Accuracy</p><h3 class="text-4xl font-bold text-emerald-400">94.2%</h3></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                <div class="lg:col-span-2 glass-dark rounded-2xl border border-slate-800 flex flex-col h-[400px]">
                    <div class="p-4 border-b border-slate-800"><h3 class="font-bold text-white">Waste Hotspot & Prediction Map</h3></div>
                    <div id="adminMap" class="w-full flex-1 z-0 rounded-b-2xl"></div>
                </div>
                <div class="glass-dark rounded-2xl border border-slate-800 p-6 flex flex-col h-[400px]">
                    <h3 class="font-bold text-white mb-4">Waste Categories</h3>
                    <div class="flex-1 relative flex items-center justify-center"><canvas id="distChart"></canvas></div>
                </div>
            </div>

            <div class="glass-dark rounded-2xl border border-slate-800 overflow-hidden mb-8">
                <div class="p-6 border-b border-slate-800"><h3 class="font-bold text-white text-lg">AI Smart Pickup Queue</h3></div>
                <table class="w-full text-left">
                    <thead><tr class="bg-slate-800/50 text-slate-400 text-xs uppercase"><th class="p-4">Location</th><th class="p-4">Waste Type</th><th class="p-4">Severity</th><th class="p-4">Priority Score</th><th class="p-4">Status</th></tr></thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>

            <div class="glass-dark rounded-2xl border border-slate-800 p-6 h-80 flex flex-col"><h3 class="font-bold text-white mb-4">Report Trends</h3><div class="flex-1 relative"><canvas id="wasteChart"></canvas></div></div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
