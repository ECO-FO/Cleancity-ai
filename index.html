<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCity AI | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-800 antialiased selection:bg-emerald-200">
    <nav class="absolute top-0 w-full p-6 glass z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-500 p-2 rounded-lg text-white"><i data-lucide="leaf"></i></div>
                <span class="text-xl font-bold tracking-tight text-slate-900">CleanCity AI</span>
            </div>
            <a href="login.html" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-full font-medium transition-all">Sign In / Demo</a>
        </div>
    </nav>
    <main class="relative pt-32 pb-20 lg:pt-48 lg:pb-32 overflow-hidden min-h-screen flex items-center">
        <div class="absolute inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-emerald-100 via-slate-50 to-white"></div>
        <div class="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-16 items-center">
            <div class="fade-in">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white shadow-sm border border-emerald-100 mb-6 text-sm font-medium text-emerald-700">
                    <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>
                    Powered by AI & Predictive Analytics
                </div>
                <h1 class="text-5xl lg:text-7xl font-extrabold text-slate-900 leading-[1.1] mb-6">Smarter Waste Management.<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-cyan-500">Cleaner Cities.</span></h1>
                <p class="text-lg text-slate-600 mb-8 leading-relaxed max-w-xl">AI-powered urban waste intelligence. Empower citizens to report problems instantly, predict waste hotspots, and prioritize cleanup.</p>
                <a href="login.html" class="inline-block bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-4 rounded-full font-semibold shadow-lg shadow-emerald-500/30 transition-all">Explore Platform →</a>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
